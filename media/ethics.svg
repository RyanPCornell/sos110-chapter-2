<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" role="img"
     aria-label="A hand-drawn illustration: two cupped hands holding a young seedling, enclosed by a dashed circle representing the boundary of moral consideration.">
  <!-- Roughening filter: fractal-noise displacement so every stroke wobbles like
       a drawn line rather than a plotted one. Same construction as the
       utilitarianism scale on the following slide. -->
  <defs>
    <filter id="e-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.017" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#e-rough)" fill="none" stroke="#33303a" stroke-width="2.3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- the circle of moral consideration: who and what we count as mattering -->
    <circle cx="170" cy="150" r="126" stroke="#6D597A" stroke-width="2.6"
            stroke-dasharray="11 10" opacity=".85"/>

    <!-- seedling: leaves, then stem over them -->
    <path d="M168 172c-22-3-38-20-40-40 21 1 38 16 41 38z"
          fill="#8fc79f" stroke="#2b5c3e"/>
    <path d="M164 148c-13-3-23-12-25-24 13 1 23 9 26 21" fill="none" stroke="#2b5c3e" stroke-width="1.7"/>

    <path d="M172 156c21-5 35-24 35-44-20 3-35 20-37 42z"
          fill="#c2e3cb" stroke="#2b5c3e"/>
    <path d="M176 136c12-5 20-15 21-27-12 3-21 12-23 24" fill="none" stroke="#2b5c3e" stroke-width="1.7"/>

    <path d="M170 214c-1-26 0-52 1-78" stroke="#2b5c3e" stroke-width="3"/>

    <!-- soil the seedling is rooted in, cradled between the palms -->
    <path d="M132 214c10-9 24-13 38-13s28 4 38 13z" fill="#c9a882" stroke="#6b5a34"/>

    <!-- cupped hands. The upright thumbs on the outside are what make these
         read as hands rather than a bowl at slide-thumbnail size. -->
    <path d="M170 258c-32 0-60-12-71-32-6-10 0-20 11-17 18 5 40 13 60 15z"
          fill="#f2ddc2" stroke="#7a5c3a"/>
    <path d="M110 209c-9-10-5-21 6-19 9 2 14 13 11 22" fill="#f2ddc2" stroke="#7a5c3a"/>
    <path d="M120 222c12 6 28 11 45 13" stroke="#7a5c3a" stroke-width="1.5"/>
    <path d="M133 240c10 4 22 7 34 8" stroke="#7a5c3a" stroke-width="1.5"/>

    <path d="M170 258c32 0 60-12 71-32 6-10 0-20-11-17-18 5-40 13-60 15z"
          fill="#f7e7d3" stroke="#7a5c3a"/>
    <path d="M230 209c9-10 5-21-6-19-9 2-14 13-11 22" fill="#f7e7d3" stroke="#7a5c3a"/>
    <path d="M220 222c-12 6-28 11-45 13" stroke="#7a5c3a" stroke-width="1.5"/>
    <path d="M207 240c-10 4-22 7-34 8" stroke="#7a5c3a" stroke-width="1.5"/>
  </g>
</svg>
